[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reversing-mcp"
version = "0.4.0"
description = "MCP server for static binary analysis and Directmedia tools (companion to ReVa for Ghidra MCP)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.4.4,<4",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "psutil>=5.8.0",
    "prefab-ui>=0.14.0",
]

[project.optional-dependencies]
  test = ["pytest>=8.0", "pytest-asyncio", "httpx"]
  dev = ["ruff>=0.16.0,<0.17", "mypy", "pyright", "pre-commit", "bandit", "safety"]
  # ClickerLab G3 driver (B1 rip + B2 tour + B3 OCR): real dev deps per the fleet
  # CUA rule (no silent false-pass). Windows-only drivers; harmless elsewhere.
  clicker = [
      "pywinauto>=0.6.8",
      "Pillow>=10.0.0",
      "pytesseract>=0.3.10",
  ]
# Headless Ghidra from Python (DecompInterface, import/analyze). Requires a local Ghidra install;
# set GHIDRA_INSTALL_DIR if not using the default path in scripts/decompile_pe_pyghidra.py.
ghidra = [
    "pyghidra>=3.0.2",
]
# Dynamic instrumentation for frida(operation=trace|script). Optional: the tool reports
# "frida not installed" without it. Spawned targets execute - see docs/FRIDA.md.
dynamic = [
    "frida>=17.0",
]

[project.scripts]
reversing-mcp = "reversing_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reversing_mcp"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP", "RUF", "T20"]
ignore = ["S101", "B008", "S106", "RUF012", "S603", "S607", "S324", "E402", "E501"]

[tool.ruff.lint.per-file-ignores]
# Test runners/builders print progress by design; the T20 ban stays on for src/.
"tests/*.py" = ["T201"]
"tests/fixtures/**/*.py" = ["T201", "S311"]
# CLI scripts report to stdout by design (exit codes carry status).
"scripts/tour/*.py" = ["T201"]
"scripts/cua_tour.py" = ["T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
