[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reversing-mcp"
version = "0.4.0"
description = "MCP server for static binary analysis and Directmedia tools (companion to ReVa for Ghidra MCP)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.1.0",
    "fastapi>=0.104.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "psutil>=5.8.0",
    "ruff>=0.15.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
]
# Headless Ghidra from Python (DecompInterface, import/analyze). Requires a local Ghidra install;
# set GHIDRA_INSTALL_DIR if not using the default path in scripts/decompile_pe_pyghidra.py.
ghidra = [
    "pyghidra>=3.0.2",
]

[project.scripts]
reversing-mcp = "reversing_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP", "RUF"]
ignore = ["S101", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
